services:
  postgres:
    image: postgres:16-alpine
    container_name: rose-glow-postgres
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: roseglo
      POSTGRES_PASSWORD: roseglo_dev
      POSTGRES_DB: rose_glow
    volumes:
      - rose_glow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roseglo -d rose_glow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rose_glow_pg:
