server {
    listen 80;
    listen [::]:80;
    server_name 200.234.44.244.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/rose-glow;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 200.234.44.244.sslip.io;

    ssl_certificate /etc/letsencrypt/live/200.234.44.244.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/200.234.44.244.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Media / video uploads via admin
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
